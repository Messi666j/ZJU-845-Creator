name: Validate Skill
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r zju-845-creator/requirements-dev.txt
      - name: Validate package
        run: python zju-845-creator/scripts/validate_skill.py
      - name: Check mathematical fixtures
        run: python zju-845-creator/scripts/verify_cases.py
